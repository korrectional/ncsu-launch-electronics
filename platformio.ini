[platformio]
; Only build/flash this env by default, so `pio run` doesn't try the
; legacy nano33ble target (which aborts).
default_envs = nano_every

[env]
framework = arduino
monitor_speed = 115200
lib_deps =
    adafruit/Adafruit DPS310 @ ^1.1.1
    ; BNO085 removed: the DPS310 barometer is the only sensor now.
    ; adafruit/Adafruit BNO08x @ ^1.2.5
    adafruit/Adafruit BusIO @ ^1.16.1
    adafruit/Adafruit Unified Sensor @ ^1.1.14

; Primary target: the actual board on the rocket (Arduino Nano Every, ATmega4809)
[env:nano_every]
platform = atmelmegaavr
board = nano_every

; Legacy target (Arduino Nano 33 BLE, nRF52840) kept so the original
; hardware can still be built for.
[env:nano33ble]
platform = nordicnrf52
board = nano33ble

; Interactive raw-SPI diagnostic console (src/diag.cpp). main.cpp is excluded
; so this build has its own setup()/loop(). Flash with:
;   pio run -e nano_every_diag -t upload
[env:nano_every_diag]
platform = atmelmegaavr
board = nano_every
build_flags = -D DIAGNOSTIC_MODE
build_src_filter = +<*> -<main.cpp>
